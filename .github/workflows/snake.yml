# Redraws the red snake every day and pushes it to the `output` branch the README reads from.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E11D2E&color_dots=#EBEDF0,#FFC9CF,#FF7A85,#E11D2E,#8A0F1C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4D2E&color_dots=#161B22,#4A0A10,#8A0F1C,#C41426,#FF2E44

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
